name: N2OArchiver
options:
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  N2OArchiver:
    type: application
    platform: macOS
    sources:
      - path: N2OArchiver
        excludes:
          - "*.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.n2o.archiver
        INFOPLIST_FILE: N2OArchiver/Info.plist
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/N2OArchiver"
          - "/opt/homebrew/opt/libarchive/include"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/libarchive/lib"
        # Static libarchive and dependencies, as in the Makefile.
        OTHER_LDFLAGS:
          - "/opt/homebrew/opt/libarchive/lib/libarchive.a"
          - "/opt/homebrew/opt/xz/lib/liblzma.a"
          - "/opt/homebrew/opt/zstd/lib/libzstd.a"
          - "/opt/homebrew/opt/lz4/lib/liblz4.a"
          - "/opt/homebrew/opt/libb2/lib/libb2.a"
          - "-lexpat"
          - "-lbz2"
          - "-lz"
          - "-liconv"
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: N2OArchiver/N2OArchiver.entitlements
        # The Makefile also copies 7zz into Contents/Helpers; Xcode builds
        # use the Homebrew 7zz.
    dependencies: []
    scheme:
      testTargets:
        - N2OArchiverTests
      commandLineArguments: {}

  N2OArchiverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        # main.m is the entry point of the standalone runner (make test).
        excludes:
          - "main.m"
          - "verify-bundle.sh"
          - "PluginFixture"
          - "Fixtures"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.n2o.archiver.tests
        # Makes NATestCase an XCTestCase subclass (see Tests/NATestCase.h).
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "NA_XCTEST=1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/N2OArchiver"
          - "$(SRCROOT)/Tests"
          - "/opt/homebrew/opt/libarchive/include"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/libarchive/lib"
        # Static libarchive and dependencies, as in the Makefile.
        OTHER_LDFLAGS:
          - "/opt/homebrew/opt/libarchive/lib/libarchive.a"
          - "/opt/homebrew/opt/xz/lib/liblzma.a"
          - "/opt/homebrew/opt/zstd/lib/libzstd.a"
          - "/opt/homebrew/opt/lz4/lib/liblz4.a"
          - "/opt/homebrew/opt/libb2/lib/libb2.a"
          - "-lexpat"
          - "-lbz2"
          - "-lz"
          - "-liconv"
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: N2OArchiver
