name: N2OArchiver
options:
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  N2OArchiver:
    type: application
    platform: macOS
    sources:
      - path: N2OArchiver
        excludes:
          - "*.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.n2o.archiver
        INFOPLIST_FILE: N2OArchiver/Info.plist
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/N2OArchiver"
          - "/opt/homebrew/opt/libarchive/include"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/libarchive/lib"
        OTHER_LDFLAGS:
          - "-larchive"
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []
    scheme:
      testTargets:
        - N2OArchiverTests
      commandLineArguments: {}

  N2OArchiverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "main.m"
          - "NATestCase.h"
          - "NATestCase.m"
          - "NALibarchiveExtractorTests.m"
          - "NAPluginManagerTests.m"
          - "NAExtractionWindowControllerTests.m"
          - "AppDelegateTests.m"
          - "NA7zExtractorTests.m"
          - "NARarExtractorTests.m"
          - "Fixtures"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.n2o.archiver.tests
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/N2OArchiver"
          - "$(SRCROOT)/Tests"
          - "/opt/homebrew/opt/libarchive/include"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/libarchive/lib"
        OTHER_LDFLAGS:
          - "-larchive"
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: N2OArchiver
