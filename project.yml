name: N2OArchiver
options:
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  N2OArchiver:
    type: application
    platform: macOS
    sources:
      - path: N2OArchiver
        excludes:
          - "*.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.n2o.archiver
        INFOPLIST_FILE: N2OArchiver/Info.plist
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/N2OArchiver"
          - "/opt/homebrew/opt/libarchive/include"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/libarchive/lib"
        OTHER_LDFLAGS:
          - "-larchive"
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []
    scheme:
      testTargets: []
      commandLineArguments: {}
