<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" role="img"
             aria-label="Finder, the open panel and the menu call AppDelegate on the main thread. AppDelegate creates one window controller per archive. The window controller starts and cancels an NAExtractionJob and receives its progress and completion. The job asks the plugin manager for an extractor and runs it on the global dispatch queue. The libarchive extractor calls the linked libarchive library; the 7z extractor calls NA7zzTool, which runs the 7zz process. Both write into the hidden staging folder. After extraction, the job has NAQuarantine copy the archive&#39;s quarantine attribute onto the staging folder before renaming it.">
          <rect width="1100" height="810" fill="var(--surface)"/>
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
            </marker>
          </defs>
  <style>
    svg { --surface:#FFFFFF; --ink:#1E1A17; --ink-2:#5B544E; --rule:#D9D5D0;
          --wood:#7E4D35; --wood-tint:#F1E8E2; --steel:#2F6A8A; --steel-tint:#E4EEF3;
          --outside-tint:#ECEBE8;
          font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#1D1B19; --ink:#EDE8E3; --ink-2:#A9A19A; --rule:#3A3632;
            --wood:#D3A47E; --wood-tint:#2C221B; --steel:#7DB5D3; --steel-tint:#16252D;
            --outside-tint:#201E1C; }
    }
    .lane-outside { fill: var(--outside-tint); }
    .lane-main { fill: var(--wood-tint); }
    .lane-bg { fill: var(--steel-tint); }
    .lane-label { font: 500 10px "IBM Plex Mono",Menlo,monospace; letter-spacing:0.08em; fill: var(--ink-2); }
    .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.25; }
    .box-main { stroke: var(--wood); stroke-width: 1.75; }
    .box-bg { stroke: var(--steel); stroke-width: 1.75; }
    .group { fill: none; stroke: var(--steel); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .title { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .sub { font-size: 11px; fill: var(--ink-2); }
    .edge { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .edge-label { font: 400 11px "IBM Plex Mono",Menlo,monospace; fill: var(--ink); }
    .edge-label-muted { font: 400 11px "IBM Plex Mono",Menlo,monospace; fill: var(--ink-2); }
    .arrowhead { fill: var(--ink-2); }
  </style>

          <!-- Lanes -->
          <rect class="lane-outside" x="0" y="20" width="1100" height="110"/>
          <rect class="lane-main" x="0" y="150" width="1100" height="290"/>
          <rect class="lane-bg" x="0" y="460" width="1100" height="150"/>
          <rect class="lane-outside" x="0" y="630" width="1100" height="165"/>
          <text class="lane-label" x="16" y="38">OUTSIDE THE PROCESS · INPUTS</text>
          <text class="lane-label" x="16" y="168">MAIN THREAD</text>
          <text class="lane-label" x="16" y="478">GLOBAL DISPATCH QUEUE</text>
          <text class="lane-label" x="16" y="789">LIBRARIES, TOOLS, OUTPUT</text>

          <!-- Lane 0: inputs -->
          <rect class="box" x="40" y="50" width="210" height="56" rx="4"/>
          <text class="title" x="145" y="74" text-anchor="middle">Finder · Open With</text>
          <text class="sub" x="145" y="92" text-anchor="middle">Info.plist document types</text>

          <rect class="box" x="300" y="50" width="190" height="56" rx="4"/>
          <text class="title" x="395" y="74" text-anchor="middle">NSOpenPanel</text>
          <text class="sub" x="395" y="92" text-anchor="middle">filtered by extractor extensions</text>

          <rect class="box" x="540" y="50" width="190" height="56" rx="4"/>
          <text class="title" x="635" y="74" text-anchor="middle">Menu (main.m)</text>
          <text class="sub" x="635" y="92" text-anchor="middle">NAMainMenu · ⌘O ⌘W ⌘M ⌘Q · localized</text>

          <rect class="box" x="860" y="50" width="210" height="56" rx="4"/>
          <text class="title" x="965" y="74" text-anchor="middle">Plugin bundles (.bundle)</text>
          <text class="sub" x="965" y="92" text-anchor="middle">PlugIns/ · Application Support</text>

          <!-- Lane 1: main thread -->
          <rect class="box box-main" x="40" y="190" width="210" height="80" rx="4"/>
          <text class="title" x="145" y="220" text-anchor="middle">AppDelegate</text>
          <text class="sub" x="145" y="238" text-anchor="middle">opens files, shows panel</text>
          <text class="sub" x="145" y="254" text-anchor="middle">quits when idle</text>

          <rect class="box box-main" x="380" y="190" width="300" height="80" rx="4"/>
          <text class="title" x="530" y="220" text-anchor="middle">NAExtractionWindowController</text>
          <text class="sub" x="530" y="238" text-anchor="middle">UI only · one window per archive</text>
          <text class="sub" x="530" y="254" text-anchor="middle">progress, cancel, error sheets, reveal</text>

          <rect class="box box-main" x="860" y="190" width="210" height="80" rx="4"/>
          <text class="title" x="965" y="220" text-anchor="middle">NAPluginManager</text>
          <text class="sub" x="965" y="238" text-anchor="middle">singleton</text>
          <text class="sub" x="965" y="254" text-anchor="middle">7z, then libarchive</text>

          <rect class="box box-main" x="380" y="330" width="300" height="80" rx="4"/>
          <text class="title" x="530" y="360" text-anchor="middle">NAExtractionJob</text>
          <text class="sub" x="530" y="378" text-anchor="middle">no AppKit · Pending → … → final state</text>
          <text class="sub" x="530" y="394" text-anchor="middle">staging, unwrap, rename, free space</text>

          <!-- Lane 2: background -->
          <rect class="group" x="190" y="475" width="585" height="125" rx="6"/>
          <text class="edge-label-muted" x="202" y="591">extractor instance · one per extraction</text>

          <rect class="box box-bg" x="200" y="495" width="230" height="70" rx="4"/>
          <text class="title" x="315" y="523" text-anchor="middle">NALibarchiveExtractor</text>
          <text class="sub" x="315" y="541" text-anchor="middle">zip, rar, tar, iso… · single .gz/.xz</text>

          <rect class="box box-bg" x="500" y="495" width="260" height="70" rx="4"/>
          <text class="title" x="630" y="523" text-anchor="middle">NA7zExtractor</text>
          <text class="sub" x="630" y="541" text-anchor="middle">subclass of NA7zzExtractor</text>

          <rect class="box box-bg" x="860" y="495" width="210" height="70" rx="4"/>
          <text class="title" x="965" y="523" text-anchor="middle">NA7zzTool</text>
          <text class="sub" x="965" y="541" text-anchor="middle">runs 7zz, parses progress</text>

          <rect class="box box-bg" x="30" y="500" width="150" height="65" rx="4"/>
          <text class="title" x="105" y="527" text-anchor="middle">NAQuarantine</text>
          <text class="sub" x="105" y="545" text-anchor="middle">descriptor-based walk</text>

          <!-- Lane 3: outside the binary -->
          <rect class="box" x="200" y="685" width="230" height="64" rx="4"/>
          <text class="title" x="315" y="711" text-anchor="middle">libarchive + lzma, zstd, lz4</text>
          <text class="sub" x="315" y="729" text-anchor="middle">linked statically into the app</text>

          <rect class="box" x="500" y="685" width="260" height="64" rx="4"/>
          <text class="title" x="630" y="711" text-anchor="middle">.n2o-extract-UUID → name</text>
          <text class="sub" x="630" y="729" text-anchor="middle">hidden until quarantined, then renamed</text>

          <rect class="box" x="860" y="685" width="210" height="64" rx="4"/>
          <text class="title" x="965" y="711" text-anchor="middle">Contents/Helpers/7zz</text>
          <text class="sub" x="965" y="729" text-anchor="middle">bundled, ≥ 25.01, hardened runtime</text>

          <!-- Edges: inputs to AppDelegate -->
          <line class="edge" x1="145" y1="106" x2="145" y2="188" marker-end="url(#arrow)"/>
          <text class="edge-label" x="153" y="152">openURLs:</text>

          <line class="edge" x1="395" y1="106" x2="238" y2="188" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
          <text class="edge-label" x="358" y="134">openDocument: / URLs</text>

          <line class="edge" x1="620" y1="106" x2="253" y2="200" marker-end="url(#arrow)"/>
          <text class="edge-label" x="392" y="170">⌘O · ⌘Q applicationShouldTerminate:</text>

          <!-- AppDelegate and window controller -->
          <line class="edge" x1="250" y1="215" x2="378" y2="215" marker-end="url(#arrow)"/>
          <text class="edge-label" x="314" y="208" text-anchor="middle">extractFileAtURL:</text>
          <line class="edge" x1="380" y1="252" x2="252" y2="252" marker-end="url(#arrow)"/>
          <text class="edge-label-muted" x="316" y="268" text-anchor="middle">window closes</text>

          <!-- Window controller and job -->
          <line class="edge" x1="490" y1="270" x2="490" y2="328" marker-end="url(#arrow)"/>
          <text class="edge-label" x="482" y="296" text-anchor="end">start · cancel</text>
          <text class="edge-label-muted" x="482" y="311" text-anchor="end">isActive → isWorking</text>
          <line class="edge" x1="570" y1="330" x2="570" y2="272" marker-end="url(#arrow)"/>
          <text class="edge-label" x="578" y="296">progressHandler</text>
          <text class="edge-label" x="578" y="311">completionHandler</text>

          <!-- Job and plugin manager -->
          <line class="edge" x1="680" y1="350" x2="898" y2="272" marker-end="url(#arrow)"/>
          <text class="edge-label" x="760" y="350">extractorForFileAtURL:</text>
          <text class="edge-label-muted" x="760" y="365">manager injected at init</text>

          <line class="edge" x1="965" y1="190" x2="965" y2="108" marker-end="url(#arrow)"/>
          <text class="edge-label" x="957" y="152" text-anchor="end">loadPlugins at launch</text>
          <text class="edge-label-muted" x="957" y="167" text-anchor="end">Apple-issued signature only</text>

          <line class="edge" x1="1000" y1="270" x2="777" y2="490" marker-end="url(#arrow)"/>
          <text class="edge-label-muted" x="935" y="405">sniff, then extension</text>

          <!-- Job and extractor -->
          <line class="edge" x1="560" y1="410" x2="560" y2="493" marker-end="url(#arrow)"/>
          <text class="edge-label" x="552" y="438" text-anchor="end">extractArchiveAtURL:…progress:</text>
          <text class="edge-label" x="552" y="453" text-anchor="end">NSProgress cancel</text>

          <line class="edge" x1="630" y1="493" x2="630" y2="412" marker-end="url(#arrow)"/>
          <text class="edge-label" x="638" y="438">result, NSProgress</text>
          <text class="edge-label-muted" x="638" y="453">read every 0.1 s</text>

          <!-- Extractors to tools -->
          <line class="edge" x1="760" y1="530" x2="858" y2="530" marker-end="url(#arrow)"/>
          <text class="edge-label" x="809" y="522" text-anchor="middle">calls</text>

          <line class="edge" x1="315" y1="565" x2="315" y2="683" marker-end="url(#arrow)"/>
          <text class="edge-label" x="323" y="637">archive_read_*</text>
          <text class="edge-label" x="323" y="652">archive_write_disk_*</text>

          <line class="edge" x1="965" y1="565" x2="965" y2="683" marker-end="url(#arrow)"/>
          <text class="edge-label" x="957" y="623" text-anchor="end">7zz x -bsp1 -p -t7z --</text>
          <text class="edge-label-muted" x="957" y="638" text-anchor="end">stdin /dev/null</text>
          <text class="edge-label-muted" x="957" y="653" text-anchor="end">terminate on cancel</text>

          <!-- Quarantine -->
          <line class="edge" x1="380" y1="390" x2="122" y2="498" marker-end="url(#arrow)"/>
          <text class="edge-label" x="330" y="395" text-anchor="end">copyQuarantineFromURL:</text>
          <text class="edge-label-muted" x="330" y="380" text-anchor="end">on the queue, after extraction</text>
          <polyline class="edge" points="100,565 100,765 630,765 630,752" marker-end="url(#arrow)"/>
          <text class="edge-label" x="250" y="781">sets com.apple.quarantine on every item</text>

          <!-- Writes -->
          <line class="edge" x1="430" y1="717" x2="498" y2="717" marker-end="url(#arrow)"/>
          <text class="edge-label" x="464" y="709" text-anchor="middle">writes</text>
          <line class="edge" x1="860" y1="717" x2="762" y2="717" marker-end="url(#arrow)"/>
          <text class="edge-label" x="811" y="709" text-anchor="middle">writes</text>
        </svg>
